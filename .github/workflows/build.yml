name: Build

# Every push to main and every pull request: build the jar and keep it as a workflow artifact.
# A tag v<version> (e.g. v0.2.0): build that version and publish it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache dependency jars
        uses: actions/cache@v6
        with:
          path: libs/*.jar
          key: libs-${{ hashFiles('tools/fetch-deps.sh') }}

      - name: Download GregTech and NTM jars
        run: ./tools/fetch-deps.sh

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$base+build.${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }} --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: ntmgt-${{ steps.version.outputs.version }}
          path: build/libs/*.jar

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
